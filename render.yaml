# Render Blueprint: Dashboard > New > Blueprint > select this repo.
# You will be asked for GEMINI_API_KEY during setup (it is never stored in the repo).
services:
  - type: web
    name: meeting-intelligence
    runtime: docker
    dockerfilePath: ./Task/Dockerfile   # app lives in Task/ (paths are relative to the repo root)
    dockerContext: ./Task
    plan: free           # free instances sleep after 15 min idle; use "starter" to keep it always on
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.5-transcribe
      - key: GEMINI_TRANSCRIPTION_FALLBACK_MODELS
        value: gemini-3.5-flash-lite
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBEDDING_MODEL
        value: embed-v4.0
      - key: CHROMA_PERSIST_DIRECTORY
        value: /app/data/chroma_db
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-db
          property: connectionString

databases:
  - name: meeting-db
    plan: free            # free Postgres expires after 30 days; use "basic-256mb" for a permanent DB
